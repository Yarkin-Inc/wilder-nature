plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}
version = "${mod_version}+mc${minecraft_version}"
group = 'net.satisfy'
base.archivesName = 'letsdo-wildernature-fabric'
repositories {
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "dev.architectury:architectury-fabric:${architectury_version}"
    implementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_fabric_version}"
    compileOnly "com.terraformersmc:modmenu:${mod_menu_version}"
    implementation "net.satisfy:Foundation:1.0.13-wildernature.1+mc26.3"
}
sourceSets.main {
    java.srcDirs = ['common/src/main/java', 'fabric/src/main/java']
    java.exclude 'net/satisfy/wildernature/core/compat/AccessoriesCompat.java'
    java.exclude 'net/satisfy/wildernature/client/compat/AccessoriesClientCompat.java'
    java.exclude 'net/satisfy/wildernature/fabric/compat/TrinketsCompat.java'
    resources.srcDirs = ['common/src/main/resources', 'fabric/src/main/resources']
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from('License') }

loom { accessWidenerPath = file("common/src/main/resources/wildernature.accesswidener") }

fabricApi.configureTests {
    createSourceSet = true
    modId = 'wildernature_test'
    enableGameTests = true
    enableClientGameTests = true
    eula = true
}

// A local installation bundle; test mods and optional compatibility layers stay out.
tasks.register('installationBundle', Sync) {
    dependsOn tasks.named('jar')
    into layout.buildDirectory.dir('installation/mods')
    from tasks.named('jar')
    from(configurations.runtimeClasspath) {
        include "fabric-api-${fabric_api_version}.jar"
        include 'architectury-fabric-*.jar'
        include 'cloth-config-fabric-*.jar'
        include 'letsdo-foundation-wildernature-api-fabric-*.jar'
    }
}
